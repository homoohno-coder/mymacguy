<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Launcher</title>
  <meta name="description" content="A clean launcher page for opening ChatGPT in a browser or macOS web app window." />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="2;url=https://chatgpt.com/" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0d1117;
      --card: rgba(255,255,255,0.08);
      --text: #f5f7fb;
      --muted: #aab3c2;
      --button: #10a37f;
      --button-hover: #0d8f70;
      --border: rgba(255,255,255,0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(16, 163, 127, 0.22), transparent 34%),
        radial-gradient(circle at 80% 80%, rgba(84, 122, 255, 0.18), transparent 32%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      padding: 34px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(22px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.34);
      text-align: center;
    }

    .mark {
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #10a37f, #0b6f59);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.02;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
      max-width: 430px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--button);
      color: white;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(16,163,127,0.28);
      transition: transform .18s ease, background .18s ease;
    }

    a.button:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .steps {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      text-align: left;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .steps strong { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <div class="mark">C</div>
    <h1>Open ChatGPT</h1>
    <p>This launcher opens ChatGPT directly. If you are already logged in, your browser session should carry over.</p>
    <a class="button" href="https://chatgpt.com/" rel="noopener">Open ChatGPT</a>
    <div class="steps">
      <strong>Mac app-style setup:</strong><br />
      Open this page in Safari, click <strong>File → Add to Dock</strong>, name it <strong>ChatGPT</strong>, then launch it from your Dock like an app.
    </div>
  </main>

  <script>
    window.setTimeout(() => {
      window.location.assign('https://chatgpt.com/');
    }, 2000);
  </script>
</body>
</html>
